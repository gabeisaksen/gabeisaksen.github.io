<!DOCTYPE html>
<html>

<head>
    <script src="ionpractice.js" defer></script>

    <title>Ion Practice</title>
</head>

<body>
    <div id="homepage">
        <h1>
            Welcome to Ion Quiz Practice!<br>
            Which quiz are you studying for?
        </h1>
        
        <button type="button" onclick="startQuiz(1)">Ion Quiz #1</button><br><br>
        <button type="button" onclick="startQuiz(2)">Ion Quiz #2</button><br><br>
        <button type="button" onclick="startQuiz(3)">Ion Quiz #3</button><br><br>
        <button type="button" onclick="startQuiz(4)">Ion Quiz #4</button><br><br>
    </div>

    <div id="quiz">
        <h1>
            <div id="question"></div>
        </h1>

        <div id="caption">Enter the matching ion name/symbol to the one above</div>

        <input type="text" id="userAnswer" name="answer" placeholder="type here..."><span id="modeLabel"></span>

        <br><div id="response"></div>
        <br><button type="button" id="nextQuestionButton" onclick="showNextQuestion()">Next Question</button>

        <br><br><br><button type="button" onclick="showHomepage()">Back to Home</button>

        <br><br>
        <div id="scriptModeInstructions">
            <span>press '^' to type a superscript</span><br>
            <span>press '_' to type a subscript</span><br>
            <span>press 'tab' to return to normal script</span><br>
        </div>
    </div>
</body>



</html>
